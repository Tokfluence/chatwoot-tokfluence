# #
# # Builds the Tokfluence Chatwoot image on GitHub runners and pushes it to GHCR.
# # Sliplane then pulls the finished image instead of compiling on the production
# # server, which is what was pegging the box during deploys.
# #

name: Publish deploy image

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  IMAGE: ghcr.io/tokfluence/chatwoot-tokfluence

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Sliplane's env-var UI does not propagate to runtime processes for this
      # project, so the non-secret tuning knobs are baked into the image. Same
      # append trick upstream uses for CW_EDITION in publish_foss_docker.yml.
      - name: Bake runtime tuning defaults
        run: |
          {
            echo ''
            echo 'ENV MALLOC_ARENA_MAX=2'
            echo 'ENV RAILS_MAX_THREADS=3'
            echo 'ENV WEB_CONCURRENCY=0'
            echo 'ENV SIDEKIQ_CONCURRENCY=3'
          } >> docker/Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
